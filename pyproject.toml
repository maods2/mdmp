[project]
name = "mdmp"
dynamic = ["version"]
description = "Bayesian dynamic regression model (MDM) for Python"
readme = "README.md"
authors = [
    { name = "MDMP Contributors" }
]
license = { text = "GPL-3.0-only" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.2",
    "matplotlib>=3.3.0",
    "networkx>=2.6.0",
    "pgmpy>=0.1.25",
    "seaborn>=0.13.2",
    "tqdm>=4.60.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/maods2/mdmp"
Repository = "https://github.com/maods2/mdmp"

[project.optional-dependencies]
notears = []
umap = ["umap-learn>=0.5"]
graphviz = ["pydot>=1.4"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-xdist>=2.0",
    "pytest-mock>=3.0",
    "black>=21.0",
    "isort>=5.0",
    "ruff>=0.1.0",
    "flake8>=3.8",
    "mypy>=0.910",
    "pre-commit>=2.20.0",
    "coverage[toml]>=6.0",
    "pgmpy>=0.1.25",
    "bump-my-version>=1.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "mdmp._version.__version__" }

[tool.setuptools]
# Use automatic package discovery to include all subpackages
# This includes: mdmp, mdmp.structure, mdmp.processing, mdmp.model, 
# mdmp.types, mdmp.plotting, and any future subpackages
packages = {find = {}}

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
mdmp = ["data/*.csv"]

[tool.bumpversion]
current_version = "0.6.2"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "mdmp/_version.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "README.md"
search = "pip install git+https://github.com/maods2/mdmp.git@v{current_version}"
replace = "pip install git+https://github.com/maods2/mdmp.git@v{new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = """  title = {{MDMP: Bayesian Dynamic Regression Model for Python}},
  author = {{}},
  version = {{{current_version}}},"""
replace = """  title = {{MDMP: Bayesian Dynamic Regression Model for Python}},
  author = {{}},
  version = {{{new_version}}},"""

[dependency-groups]
dev = [
    "ipykernel",
    "pytest>=8.3.5",
    "pytest-cov>=2.0",
    "bump-my-version>=1.0",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["mdmp"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pgmpy.*",
    "networkx.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=mdmp --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["mdmp"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
